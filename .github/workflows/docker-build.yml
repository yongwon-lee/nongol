name: Build and Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/yongwon-lee/nongol:latest
            ghcr.io/yongwon-lee/nongol:${{ github.sha }}

      - name: Update Kubernetes Image Tag
        run: |
          sed -i "s|image: ghcr.io/yongwon-lee/nongol:.*|image: ghcr.io/yongwon-lee/nongol:${GITHUB_SHA}|" \
            k8s/deployment.yaml

      - name: Commit Kubernetes Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes"
            exit 0
          fi

          git commit -m "deploy: ${GITHUB_SHA}"
          git push
